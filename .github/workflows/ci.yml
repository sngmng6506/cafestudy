name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cafestudy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cafestudy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cafestudy_test
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'

      - name: Check JavaScript syntax
        run: npm run check:js

      - name: Apply migrations
        run: npm run db:migrate

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build
